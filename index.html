<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phronesis</title>
<meta name="theme-color" content="#01040b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#01040b;--fg:#e8eef8;--dim:#8796ad;--line:rgba(140,190,255,.18);--blue:#7fc4ff;--gold:#ffcf86;--red:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#gl,#hd,#fx,#hd3{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{transition:opacity 1.4s ease}
#hd,#fx{transition:opacity 1.2s ease}
body.dormant #hd,body.dormant #fx,body.dormant #hd3{opacity:0}
#hd3{transition:opacity 1.2s ease}
body.h3 #hd,body.h3 #fx{display:none}
#avw{position:absolute;left:50%;top:calc(50% - 6vh);width:min(94vw,74vh);aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;transition:opacity 1.6s ease;pointer-events:none;
 -webkit-mask-image:radial-gradient(ellipse 46% 52% at 50% 46%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 46% 52% at 50% 46%,#000 55%,transparent 100%)}
#av{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.04) brightness(1.02)}
#avw .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,190,255,.05) 0 1px,transparent 1px 4px);mix-blend-mode:screen;box-shadow:inset 0 0 90px rgba(80,160,255,.35)}
body.face.live #avw{opacity:1}
body.face #hd,body.face #fx,body.face #hd3{opacity:0!important}
body.faceout #avw{opacity:0!important;transition:opacity 1.8s ease}
/* embed mode: inside the hub's Phronesis section, transparent, no page chrome of its own */
body.embed,html:has(body.embed){background:transparent!important}
body.embed header,body.embed #hint,body.embed #mic,body.embed #load,body.embed #gl,body.embed #lab{display:none!important}
body.embed footer{padding-bottom:10px}
body.embed #cap{font-size:clamp(14px,2.2vh,19px);max-width:92%}
body.embed.dormant #hd,body.embed.dormant #fx,body.embed.dormant #hd3,body.embed.dormant #avw{opacity:0}
/* overlay mode: he sits in the middle of the hub, framed by a soft glow instead of a window */
body.overlay{background:radial-gradient(ellipse at 50% 42%,#071226 0%,#01040b 70%)}
body.overlay header .mark{font-size:15px;letter-spacing:.28em;opacity:.7}
body.overlay #hint{display:none}
body.overlay #cap{font-size:18px}
body.overlay::after{content:"";position:fixed;inset:0;pointer-events:none;border:1px solid rgba(127,196,255,.28);border-radius:18px;box-shadow:inset 0 0 60px rgba(60,140,255,.18)}
body:not(.h3) #hd3{display:none}
body:not(.dormant) #gl,body:not(.dormant) #lab{opacity:0;pointer-events:none}
#lab{transition:opacity 1.2s ease}
#lab{position:absolute;inset:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;z-index:5}
.mark{font:600 22px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.32em;text-transform:uppercase}
.chip{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3b4658;box-shadow:0 0 0 0 transparent;transition:background .3s}
.chip[data-s=listening] .dot{background:var(--blue);box-shadow:0 0 12px var(--blue)}
.chip[data-s=speaking] .dot{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.chip[data-s=thinking] .dot{background:#c9a5ff;box-shadow:0 0 12px #c9a5ff}
.chip[data-s=error] .dot{background:var(--red)}
footer{position:fixed;left:0;right:0;bottom:0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:16px;z-index:5;pointer-events:none}
#cap{max-width:640px;min-height:3.2em;text-align:center;font:500 21px/1.45 'Cormorant Garamond',Georgia,serif;color:var(--fg);text-shadow:0 2px 14px #000;transition:opacity .4s}
#cap .you{display:block;font:400 13px/1.4 Inter,sans-serif;color:var(--dim);margin-bottom:4px}
#mic{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,rgba(127,196,255,.18),rgba(1,4,11,.85));color:var(--fg);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .2s}
#mic:active{transform:scale(.95)}
#mic svg{width:30px;height:30px}
#mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--blue);opacity:0;transform:scale(calc(1 + var(--lv,0)*.35));transition:opacity .3s}
body.live #mic::after{opacity:.7}
body.live.speaking #mic::after{border-color:var(--gold)}
.hint{font-size:12px;color:var(--dim);letter-spacing:.06em;text-align:center}
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:var(--bg);transition:opacity .8s}
#load.gone{opacity:0;pointer-events:none}
#load .in{display:flex;flex-direction:column;align-items:center;gap:18px}
#load .ring{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}
#load.ready .ring{display:none}
#go{display:none;padding:14px 26px;border-radius:999px;border:1px solid var(--blue);background:transparent;color:var(--fg);font:500 15px Inter,sans-serif;letter-spacing:.08em;cursor:pointer}
#load.ready #go{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#load .ring{animation:none}}
</style>
</head>
<body class="dormant">
<div id="stage"><canvas id="gl"></canvas><canvas id="lab"></canvas><canvas id="hd"></canvas><canvas id="fx"></canvas><canvas id="hd3"></canvas><div id="avw"><video id="av" autoplay playsinline></video><div class="scan"></div></div></div>
<header><div class="mark">Phronesis</div><div class="chip" id="chip" data-s="dormant"><span class="dot"></span><span id="st">Dormant</span></div></header>
<footer>
  <div id="cap"></div>
  <button id="mic" aria-label="Talk to Phronesis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div class="hint" id="hint">Tap to talk, or say "Hello Phronesis"</div>
</footer>
<div id="load"><div class="in"><div class="ring"></div><div class="mark">Phronesis</div><div class="hint" id="lmsg">Preparing his voice…</div><button id="go">Wake Phronesis</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="land.js?v=1793342314"></script>
<script src="head_shaders.js?v=1793342314"></script>
<script src="head_core.js?v=1793342314"></script>
<script src="globe.js?v=1793342314"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
  import { createHead3D } from './3d/head3d.js?v=1793345019';
  const q = new URLSearchParams(location.search);
  window.PHR3D = q.get('head') === 'flat' ? Promise.reject(new Error('flat chosen')) : createHead3D(document.getElementById('hd3'), { base: '3d/', holo: 1 });
  window.PHR3D.catch(() => {});
  const s = document.createElement('script'); s.src = 'app.js?v=1793345642'; document.body.appendChild(s);
</script>
</body>
</html>
